name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sigil-pipeline:
    name: sigil pipeline (TS ↔ Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: api/go.sum

      - name: Typecheck
        run: npm run typecheck

      - name: TypeScript tests
        run: npm test

      # The drift guard. The corpus is generated from TypeScript and committed;
      # Go verifies against the committed copy. That means a TS-side change which
      # forgot to regenerate leaves Go passing against a stale referee, and the
      # mismatch only surfaces as a user receiving a different sigil than they
      # watched form. Regenerating here and failing on any diff is what closes it.
      - name: Corpus is up to date with the TypeScript that generates it
        run: |
          npm run gencorpus
          git diff --exit-code api/sigil/testdata/corpus.json \
            || { echo "::error::corpus.json is stale — run 'npm run gencorpus' and commit the result"; exit 1; }

      - name: Go vet
        run: go vet ./api/...

      # -race because the ledger is the one place with real concurrency: Append
      # assigns a position and mints inside the same critical section, and a data
      # race there means two certificates printing the same serial.
      - name: Go tests
        run: go test -race ./api/...

  certificate:
    name: certificate is print-exact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The certificate prints at a fixed box with overflow:hidden, so content
      # that misses the box is clipped rather than reflowed — it still produces a
      # plausible-looking sheet with its footer missing. That is precisely the
      # failure a human reviewer scrolling a diff will not catch, so it is
      # measured here instead.
      - name: Render and measure the A4 sheet
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run verify:certificate

  image:
    name: the deployable image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile is the only place the SPA build and the Go build meet,
      # and the only place the app is served from the API's origin. A break
      # there is invisible to both jobs above — they never build the image.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
