name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sigil-pipeline:
    name: sigil pipeline (TS ↔ Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: api/go.sum

      - name: Typecheck
        run: npm run typecheck

      - name: TypeScript tests
        run: npm test

      # The drift guard. The corpus is generated from TypeScript and committed;
      # Go verifies against the committed copy. That means a TS-side change which
      # forgot to regenerate leaves Go passing against a stale referee, and the
      # mismatch only surfaces as a user receiving a different sigil than they
      # watched form. Regenerating here and failing on any diff is what closes it.
      - name: Corpus is up to date with the TypeScript that generates it
        run: |
          npm run gencorpus
          git diff --exit-code api/sigil/testdata/corpus.json \
            || { echo "::error::corpus.json is stale — run 'npm run gencorpus' and commit the result"; exit 1; }

      - name: Go vet
        run: go vet ./api/...

      - name: Go tests
        run: go test ./api/...
