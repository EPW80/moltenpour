<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0A060D;}
a{color:#C9922E;text-decoration:none}a:hover{color:#F5D67A}
doc-page:not(:defined){visibility:hidden}
</style>
<script src="./doc-page.js"></script>
</helmet>
<doc-page size="a4">
  <section class="page" data-screen-label="Certificate of Waste" style="position:relative;overflow:hidden;background:radial-gradient(115% 70% at 50% -10%, #2A1136 0%, #1A0E1E 48%, #120A15 100%);color:#C9A24A;font-family:ui-monospace,'SF Mono',Menlo,monospace">

    <sc-if value="{{ grain }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay;background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>&quot;)"></div>
    </sc-if>
    <div style="position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(10,6,13,.55)"></div>

    <div style="position:absolute;inset:26px;pointer-events:none;border:1px solid rgba(201,146,46,.5)"></div>
    <div style="position:absolute;inset:33px;pointer-events:none;border:1px solid rgba(201,146,46,.24)"></div>
    <div style="position:absolute;top:40px;left:40px;width:15px;height:15px;pointer-events:none;border-top:1px solid rgba(245,214,122,.7);border-left:1px solid rgba(245,214,122,.7)"></div>
    <div style="position:absolute;top:40px;right:40px;width:15px;height:15px;pointer-events:none;border-top:1px solid rgba(245,214,122,.7);border-right:1px solid rgba(245,214,122,.7)"></div>
    <div style="position:absolute;bottom:40px;left:40px;width:15px;height:15px;pointer-events:none;border-bottom:1px solid rgba(245,214,122,.7);border-left:1px solid rgba(245,214,122,.7)"></div>
    <div style="position:absolute;bottom:40px;right:40px;width:15px;height:15px;pointer-events:none;border-bottom:1px solid rgba(245,214,122,.7);border-right:1px solid rgba(245,214,122,.7)"></div>

    <div style="position:relative;height:100%;box-sizing:border-box;padding:52px 62px 46px;display:flex;flex-direction:column">

      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:20px;font-size:12px;letter-spacing:2.6px;text-transform:uppercase;color:{{ secondary }};padding-bottom:14px;border-bottom:1px solid rgba(201,146,46,.28)">
        <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Molten Pour · Office of Disbursement</span>
        <span style="font-variant-numeric:tabular-nums;white-space:nowrap">{{ serial }}</span>
      </div>

      <div style="display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:20px">
        <h1 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:400;font-size:34px;line-height:1;letter-spacing:8px;text-indent:8px;color:#F7E9C2;text-shadow:0 0 40px rgba(201,146,46,.3)">CERTIFICATE OF WASTE</h1>
        <span style="font-size:12px;letter-spacing:3.4px;text-transform:uppercase;color:#B08A3C;text-align:center">Issued upon irreversible disbursement</span>
        <div style="display:flex;align-items:center;gap:14px;width:290px;padding-top:6px">
          <span style="flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,146,46,.55))"></span>
          <span style="font-family:'Bodoni Moda',serif;font-style:italic;font-size:17px;letter-spacing:2px;color:{{ accent }};white-space:nowrap">non revertitur</span>
          <span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(201,146,46,.55),transparent)"></span>
        </div>
      </div>

      <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0 2px">{{ sigil }}</div>

      <div style="display:flex;justify-content:center;padding-bottom:16px">
        <span style="font-size:12px;letter-spacing:3px;text-transform:uppercase;color:{{ secondary }};font-variant-numeric:tabular-nums">{{ sigilCaption }}</span>
      </div>

      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
          <div style="display:flex;align-items:baseline;gap:16px;padding:5px 2px 4px;border-bottom:1px solid rgba(201,146,46,.2)">
            <span style="font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:{{ secondary }};white-space:nowrap">{{ r.label }}</span>
            <span style="flex:1;height:1px;background:repeating-linear-gradient(90deg,rgba(201,146,46,.3) 0 1px,transparent 1px 5px)"></span>
            <span style="font-family:'Bodoni Moda',serif;font-size:17px;letter-spacing:.4px;color:{{ accent }};font-variant-numeric:tabular-nums;white-space:nowrap">{{ r.value }}</span>
          </div>
        </sc-for>
      </div>

      <div style="display:flex;justify-content:center;padding:16px 0 14px">
        <span style="font-family:'Bodoni Moda',serif;font-style:italic;font-size:22px;letter-spacing:1.5px;color:#F7E9C2">for nothing</span>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-top:14px;border-top:1px solid rgba(201,146,46,.28);font-size:12px;letter-spacing:1.9px;text-transform:uppercase;color:#B08A3C">
        <span style="max-width:70%">This instrument confers no right, claim, or residual value.</span>
        <span style="font-family:'Bodoni Moda',serif;font-style:italic;font-size:14px;letter-spacing:.5px;text-transform:none;color:{{ secondary }};white-space:nowrap">rev. vii — mmxxvi</span>
      </div>
    </div>
  </section>
</doc-page>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;tier&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Singular&quot;,&quot;options&quot;:[&quot;Common&quot;,&quot;Uncommon&quot;,&quot;Rare&quot;,&quot;Singular&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Classification&quot;},&quot;grain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Stock&quot;},&quot;sigilSeed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1284,&quot;min&quot;:1,&quot;max&quot;:9999,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Sigil&quot;}}">
const TIERS = {
  Common:    { accent:'#D8BC7E', secondary:'#B08A3E', substance:'Brass',        consideration:'Free' },
  Uncommon:  { accent:'#F5D67A', secondary:'#C9922E', substance:'Gold',         consideration:'USD 2.99' },
  Rare:      { accent:'#FFF6D8', secondary:'#E8C260', substance:'Alloy',        consideration:'USD 24.99' },
  Singular:  { accent:'#E8BCF2', secondary:'#C97AD8', substance:'Living Metal', consideration:'USD 99.99' },
};

const rng = (seed) => {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

const poolPath = (r, cx, cy, base) => {
  const N = 12, pts = [];
  for (let i = 0; i < N; i++){
    const a = (i / N) * Math.PI * 2;
    const rad = base * (0.74 + r() * 0.44);
    pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
  }
  let d = '';
  for (let i = 0; i < N; i++){
    const p = pts[i], q = pts[(i + 1) % N];
    const m = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    d += i === 0 ? `M ${m[0].toFixed(1)} ${m[1].toFixed(1)}` : '';
    const n = pts[(i + 1) % N], nn = pts[(i + 2) % N];
    const m2 = [(n[0] + nn[0]) / 2, (n[1] + nn[1]) / 2];
    d += ` Q ${q[0].toFixed(1)} ${q[1].toFixed(1)} ${m2[0].toFixed(1)} ${m2[1].toFixed(1)}`;
  }
  return d + ' Z';
};

class Component extends DCLogic {
  buildSigil(seed, accent, secondary){
    const r = rng(seed), h = React.createElement;
    const cx = 200, cy = 200, base = 74;
    const gid = 'pool-' + seed;
    const kids = [
      h('defs', { key:'d' },
        h('radialGradient', { id: gid, cx:'50%', cy:'50%', r:'50%' },
          h('stop', { offset:'0%',  stopColor: accent, stopOpacity:'0.95' }),
          h('stop', { offset:'55%', stopColor: secondary, stopOpacity:'0.42' }),
          h('stop', { offset:'100%', stopColor:'#1A0E1E', stopOpacity:'0.05' }))),
      h('path', { key:'p', d: poolPath(r, cx, cy, base), fill:`url(#${gid})`, stroke: accent, strokeOpacity:'0.55', strokeWidth:'0.9' }),
    ];
    for (let i = 0; i < 9; i++){
      const a = (i / 9) * Math.PI * 2 + 0.18;
      const r0 = base * 0.94, r1 = Math.min(194, r0 + 32 + r() * 100);
      kids.push(h('line', {
        key: 't' + i,
        x1: (cx + Math.cos(a) * r0).toFixed(1), y1: (cy + Math.sin(a) * r0).toFixed(1),
        x2: (cx + Math.cos(a) * r1).toFixed(1), y2: (cy + Math.sin(a) * r1).toFixed(1),
        stroke: secondary, strokeOpacity: (0.5 + r() * 0.4).toFixed(2), strokeWidth: (0.7 + r() * 2.1).toFixed(2),
      }));
    }
    for (let i = 0; i < 26; i++){
      const a = (i / 26) * Math.PI * 2 + (r() - 0.5) * 0.08;
      const rad = base + 42 + r() * 74;
      kids.push(h('circle', {
        key: 's' + i,
        cx: (cx + Math.cos(a) * rad).toFixed(1), cy: (cy + Math.sin(a) * rad).toFixed(1),
        r: (1.9 + r() * 4.6).toFixed(2),
        fill: secondary, fillOpacity: (0.55 + r() * 0.4).toFixed(2),
      }));
    }
    return h('svg', { viewBox:'0 0 400 400', width:'100%', height:'100%', style:{ display:'block', maxHeight:'100%', maxWidth:'300px', margin:'0 auto', flex:'0 1 auto' }, 'aria-hidden':'true' }, kids);
  }

  renderVals(){
    const name = TIERS[this.props.tier] ? this.props.tier : 'Singular';
    const t = TIERS[name];
    const seed = this.props.sigilSeed ?? 1284;
    return {
      grain: this.props.grain ?? true,
      accent: t.accent,
      secondary: t.secondary,
      serial: 'MP-0001284-6AE8',
      sigilCaption: 'Pour №1,284 · ' + name + ' · ' + t.substance,
      sigil: this.buildSigil(seed, t.accent, t.secondary),
      rows: [
        { label:'Serial', value:'MP-0001284-6AE8' },
        { label:'Ledger position', value:'No. 1,284' },
        { label:'Substance', value: t.substance },
        { label:'Classification', value: name },
        { label:'Mass rendered irrecoverable', value:'310.97 g' },
        { label:'Batch', value:'277-T' },
        { label:'Consideration', value: t.consideration },
        { label:'Issued', value:'2026-08-02' },
      ],
    };
  }
}

</script>
</body>
</html>
